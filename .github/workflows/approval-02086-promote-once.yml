name: Promote approval consumer against real Loop 0.20.86 (temporary)
on:
  push:
    branches:
      - test/approval-consumer-0.20.86-promotion-20261108

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'voku/agent-ui' && github.ref == 'refs/heads/test/approval-consumer-0.20.86-promotion-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Guard source revision, original PR branch and immutable published tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/approval-ui-approved-baseline-regression
          test "$(git rev-parse origin/test/approval-ui-approved-baseline-regression)" = "69ab8e64f11a0e0182a56ee2a3ebe8677f62deb3"
          test "$(git merge-base HEAD origin/test/approval-ui-approved-baseline-regression)" = "69ab8e64f11a0e0182a56ee2a3ebe8677f62deb3"
          git cat-file -e d8eeb4ce4f1c1963820592e668d012953b720db1^{commit}
          target="$(git ls-remote --tags https://github.com/voku/agent-loop.git 'refs/tags/0.20.86^{}' | awk '{print $1}')"
          test "$target" = "f750f4bb1d798db6d0f69d5e73865584ac47c943"
      - name: Require released 0.20.86 and install the actual stable Composer package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          file = Path('composer.json')
          value = file.read_text()
          before = '"voku/agent-loop": "^0.20.85"'
          assert value.count(before) == 1, 'Unexpected Composer constraint'
          file.write_text(value.replace(before, '"voku/agent-loop": "^0.20.86"'))
          PY
          composer install --no-interaction --prefer-dist --no-progress
          composer show voku/agent-loop --format=json | jq -e '.versions | index("0.20.86") != null'
      - name: Regenerate canonical owner-managed Claude skills and agents
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config --dry-run
          vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config
      - name: Execute real stable-dependency CI (nothing excluded)
        run: composer ci
      - name: Commit only the successfully verified consumer promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub owner-version integration'
          git config user.email 'agent-ui-owner-integration@users.noreply.github.com'
          git rm .github/workflows/approval-02086-promote-once.yml
          git add composer.json .claude/skills .claude/agents
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --name-only
          git commit -m 'fix(ui): consume released agent-loop 0.20.86 and resync managed assets'
          git push origin HEAD:refs/heads/test/approval-consumer-0.20.86-promotion-20261108
