name: One-shot released owner skill reprojection proof

on:
  push:
    branches: [fix/ui-managed-loop-0.20.87-20261109]

permissions:
  contents: read

jobs:
  generate-managed-manifest:
    name: Generate and verify owner-managed Claude projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Use the released Loop owner installer
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $metadata = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR);
            $packages = $metadata["packages"] ?? $metadata;
            foreach ($packages as $package) {
              if (($package["name"] ?? null) === "voku/agent-loop") {
                if (($package["version"] ?? null) !== "0.20.87") {
                  fwrite(STDERR, "Wrong Loop owner version.\n");
                  exit(1);
                }
                exit(0);
              }
            }
            fwrite(STDERR, "Loop owner dependency missing.\n");
            exit(1);
          '
          vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config --force
          cmp vendor/voku/agent-loop/resources/skills/agent-loop-php-setup/SKILL.md .claude/skills/agent-loop-php-setup/SKILL.md
          actual="$(git diff --name-only)"
          test "$actual" = '.claude/skills/.agent-loop-manifest.json' || { echo "Unexpected managed changes: $actual" >&2; exit 1; }
          composer ci
      - name: Emit exact generated manifest for review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          manifest = Path(".claude/skills/.agent-loop-manifest.json").read_bytes()
          print("OWNER_GENERATED_MANIFEST_SHA256=" + hashlib.sha256(manifest).hexdigest())
          print("OWNER_GENERATED_MANIFEST_BASE64_BEGIN")
          print(base64.b64encode(manifest).decode("ascii"))
          print("OWNER_GENERATED_MANIFEST_BASE64_END")
          PY
