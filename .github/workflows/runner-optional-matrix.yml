name: Runner optional matrix
on:
  push:
  pull_request:
jobs:
  runner-absent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install production graph without optional Runner
        run: composer install --no-interaction --prefer-dist --no-dev
      - name: Prove UI remains usable without Runner
        run: php tools/runner-optional-smoke.php absent

  runner-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install released Runner graph
        run: composer install --no-interaction --prefer-dist
      - name: Prove typed Runner owner projection
        run: php tools/runner-optional-smoke.php installed
