name: One-shot managed PHP skill sync

on:
  push:
    branches:
      - test/approval-ui-approved-baseline-regression
    paths:
      - .github/workflows/one-shot-owner-skill-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: test/approval-ui-approved-baseline-regression
          persist-credentials: true
      - name: Verify source identity
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUSH_SHA"
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install published dependencies safely
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Require published owner release
        shell: bash
        run: |
          set -euo pipefail
          composer show --no-ansi voku/agent-loop | grep -E '^versions[[:space:]]*:?[[:space:]]*0\\.20\\.87([^0-9]|$)'
          cmp vendor/voku/agent-loop/resources/skills/agent-loop-php-setup/SKILL.md <(git show HEAD:.claude/skills/agent-loop-php-setup/SKILL.md) && {
            echo "Skill was already byte-for-byte up to date; no mutation needed." >&2
            exit 1
          } || true
      - name: Regenerate owned Claude projection with released CLI
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config
          cmp vendor/voku/agent-loop/resources/skills/agent-loop-php-setup/SKILL.md .claude/skills/agent-loop-php-setup/SKILL.md
          git diff --name-only | tee /tmp/sync-files.txt
          while IFS= read -r changed; do
            case "$changed" in
              .claude/skills/agent-loop-php-setup/SKILL.md|.claude/skills/.agent-loop-manifest.json) ;;
              *) echo "Unexpected generated change: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/sync-files.txt
          grep -Fxq '.claude/skills/agent-loop-php-setup/SKILL.md' /tmp/sync-files.txt
          grep -Fxq '.claude/skills/.agent-loop-manifest.json' /tmp/sync-files.txt
      - name: Execute complete PHP quality suite before committing
        run: composer ci
      - name: Commit exactly the managed outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- .claude/skills/agent-loop-php-setup/SKILL.md .claude/skills/.agent-loop-manifest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(skills): regenerate Claude projection from agent-loop 0.20.87'
          git push origin HEAD:refs/heads/test/approval-ui-approved-baseline-regression
