name: Reproject agent-loop 0.18.4 assets

on:
  push:
    branches:
      - 'claude/agent-loop-blind-spot-analysis-2rzc10'

permissions:
  contents: write

jobs:
  reproject:
    if: github.event.head_commit.message == 'chore: run released agent-loop 0.18.4 reprojector'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install exact released Loop graph
        shell: bash
        run: |
          set -euo pipefail
          composer config repositories.agent-loop vcs https://github.com/voku/agent-loop
          composer update voku/agent-loop --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-ansi
          test "$(composer show voku/agent-loop --format=json | jq -r '.versions[0]')" = '0.18.4'
      - name: Reproject managed Claude assets through the released owner
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/agent-loop init install-assets --agent=claude --force --skip-git-config
          git checkout -- composer.json
          rm -f composer.lock
      - name: Commit only generated projection changes
        shell: bash
        run: |
          set -euo pipefail
          git add .claude AGENTS.md CLAUDE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No projection changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reproject released agent-loop 0.18.4 assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
