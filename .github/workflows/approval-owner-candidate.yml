name: Approval UX against exact Loop candidate (temporary)
on:
  push:
    branches: [test/approval-ui-approved-baseline-regression]
  pull_request:
    paths:
      - '.github/workflows/approval-owner-candidate.yml'
      - 'src/Feature/Task/**'
      - 'src/Integration/AgentLoop/HumanDecisionGateway.php'
      - 'templates/task/index.php'
      - 'tests/Integration/ContractRevisionDeltaTest.php'

permissions:
  contents: read

jobs:
  focused-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install declared stable dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Checkout exact unmerged Loop owner candidate
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: 64b36c22d216cec0d0e38890bfe75b6b307819b0
          path: .candidate-agent-loop
          persist-credentials: false
      - name: Substitute only the owner source in this disposable runner
        run: |
          test -d vendor/voku/agent-loop
          test -f .candidate-agent-loop/src/Workflow/WorkflowHumanDecisionProjector.php
          test "$(git -C .candidate-agent-loop rev-parse HEAD)" = "64b36c22d216cec0d0e38890bfe75b6b307819b0"
          rm -rf vendor/voku/agent-loop
          mv .candidate-agent-loop vendor/voku/agent-loop
          composer dump-autoload --no-interaction
      - name: Verify real browser approval integration
        run: vendor/bin/phpunit tests/Integration/ContractRevisionDeltaTest.php
      - name: Run broader UI suite against exact owner candidate (excluding managed release projection only)
        run: |
          # The managed skill projection is intentionally checked by ordinary CI against released packages.
          # This temporary run proves runtime compatibility with an unmerged owner, not release readiness.
          vendor/bin/phpunit --filter '^(?!.*ManagedSkillProjectionTest)'
      - name: Check UI static analysis and formatting
        run: |
          composer phpstan
          composer template-lint
          composer cs-check
