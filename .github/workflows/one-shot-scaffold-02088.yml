name: One-shot released scaffold guard projection

on:
  push:
    branches:
      - test/approval-ui-approved-baseline-regression
    paths:
      - .github/workflows/one-shot-scaffold-02088.yml

permissions:
  contents: write

jobs:
  project-owner-assets:
    name: Regenerate exactly two owner-managed assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned branch head
        uses: actions/checkout@v7
        with:
          ref: test/approval-ui-approved-baseline-regression
          persist-credentials: true
      - name: Verify exact input head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install published packages without project hooks
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Verify published version and security contract
        shell: bash
        run: |
          set -euo pipefail
          composer show --no-ansi voku/agent-loop | grep -F '0.20.88'
          grep -Fq '**Scaffold destination safety.**' vendor/voku/agent-loop/resources/skills/agent-loop-php-setup/SKILL.md
      - name: Regenerate managed Claude skills using released owner CLI
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config
          cmp vendor/voku/agent-loop/resources/skills/agent-loop-php-setup/SKILL.md .claude/skills/agent-loop-php-setup/SKILL.md
          git diff --name-only | tee /tmp/changed-managed-assets.txt
          while IFS= read -r changed; do
            case "$changed" in
              .claude/skills/agent-loop-php-setup/SKILL.md|.claude/skills/.agent-loop-manifest.json) ;;
              *) echo "Unexpected changed file: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/changed-managed-assets.txt
          test "$(wc -l < /tmp/changed-managed-assets.txt)" -eq 2
          grep -Fxq '.claude/skills/agent-loop-php-setup/SKILL.md' /tmp/changed-managed-assets.txt
          grep -Fxq '.claude/skills/.agent-loop-manifest.json' /tmp/changed-managed-assets.txt
      - name: Full PHP quality suite before commit
        run: composer ci
      - name: Commit and push only generated assets
        shell: bash
        run: |
          set -euo pipefail
          git add -- .claude/skills/agent-loop-php-setup/SKILL.md .claude/skills/.agent-loop-manifest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(skills): sync released agent-loop 0.20.88 scaffold guard'
          git push origin HEAD:refs/heads/test/approval-ui-approved-baseline-regression
