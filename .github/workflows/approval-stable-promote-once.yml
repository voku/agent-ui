name: Promote cumulative approval UI to released owner 0.20.85 (one-shot)
on:
  push:
    branches: [test/approval-stable-0.20.85-promotion-20261108]
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'voku/agent-ui' && github.ref == 'refs/heads/test/approval-stable-0.20.85-promotion-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Guard exact candidate refs; merge existing shipped briefing
        run: |
          set -euo pipefail
          git config user.name 'Approval stable integration CI'
          git config user.email 'approval-stable-integration@users.noreply.github.com'
          git fetch origin main test/approval-ui-approved-baseline-regression
          test "$(git merge-base HEAD origin/test/approval-ui-approved-baseline-regression)" = "93e355f00441f3e06d21af82aad359e6b9a25538"
          test "$(git rev-parse origin/test/approval-ui-approved-baseline-regression)" = "93e355f00441f3e06d21af82aad359e6b9a25538"
          test "$(git rev-parse origin/main)" = "ef9622f24f269dde74468c24df4ad45536671258"
          if ! git merge --no-commit --no-ff origin/main; then
            # Only the known outdated Composer dependency overlap may be reconciled.
            test "$(git diff --name-only --diff-filter=U)" = "composer.json"
            git checkout --theirs composer.json
            git add composer.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Switch to released owner and retire old draft comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          composer = Path('composer.json')
          c = composer.read_text()
          old = '"voku/agent-loop": "^0.20.84"'
          assert c.count(old) == 1, 'unexpected owner requirement'
          composer.write_text(c.replace(old, '"voku/agent-loop": "^0.20.85"'))
          template = Path('templates/task/index.php')
          s = template.read_text()
          marker = '        <?php if ($contract->revision > 2): ?>'
          assert s.count(marker) == 1
          start = s.index(marker)
          end = s.index('        <div class="btn-row">', start)
          assert 'Revision history matters:' in s[start:end]
          template.write_text(s[:start] + s[end:])
          test = Path('tests/Integration/ContractDecisionDeltaPageTest.php')
          s = test.read_text()
          changes = {
              'testMultiRevisionBriefingWarnsThatAnIntermediateDraftMayHideChanges':
                  'testMultiRevisionBriefingUsesOwnerApprovedBaselineWithoutObsoleteWarning',
              "self::assertStringContainsString('draft revision 2.', $main);":
                  "self::assertStringContainsString('approved revision 1.', $main);",
              "self::assertStringContainsString('The displayed delta may omit earlier', $main);":
                  "self::assertStringNotContainsString('Revision history matters:', $main);",
              "self::assertStringContainsString('href=\"/task/APP-1/history\">revision event timeline</a>', $main);":
                  '',
              "self::assertStringContainsString('not complete archived Contract contents.', $main);":
                  '',
              "self::assertStringContainsString('a complete cumulative comparison is not yet available here.', $main);":
                  '',
          }
          for old, new in changes.items():
              assert s.count(old) == 1, f'expected one occurrence: {old}'
              s = s.replace(old, new)
          test.write_text('\n'.join(line.rstrip() for line in s.split('\n')))
          PY
          git rm .github/workflows/approval-owner-candidate.yml
          git rm .github/workflows/approval-stable-promote-once.yml
      - name: Install real stable Composer graph and prove tagged owner version
        run: |
          composer install --no-interaction --prefer-dist
          composer show voku/agent-loop --format=json | jq -e '.versions | index("0.20.85") != null'
      - name: Regenerate installed package-owned Claude assets without project-local roots
        run: |
          vendor/bin/agent-loop init install-assets --agent=claude --no-package-subagents --skip-git-config --dry-run
          vendor/bin/agent-loop init install-assets --agent=claude --no-package-subagents --skip-git-config
          git status --short
      - name: Execute ordinary full Composer CI against released owner
        run: composer ci
      - name: Commit only successful stable integration to original draft PR
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'fix(ui): consume released owner approval projection and retire interim warning'
          test "$(git ls-remote origin refs/heads/test/approval-ui-approved-baseline-regression | cut -f1)" = "93e355f00441f3e06d21af82aad359e6b9a25538"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "ef9622f24f269dde74468c24df4ad45536671258"
          git push origin HEAD:refs/heads/test/approval-ui-approved-baseline-regression
