name: One-off managed Claude skill refresh for approval briefing
on:
  push:
    branches:
      - feat/contract-approval-briefing-20261108
    paths:
      - .github/workflows/approval-skill-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install declared Composer dependency graph
        run: composer install --no-interaction --prefer-dist
      - name: Regenerate managed Claude assets through their semantic owner
        run: vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config
      - name: Fail closed if the generator changed any non-skill project assets
        run: |
          git status --short --untracked-files=all
          if git status --porcelain --untracked-files=all | cut -c4- | grep -v '^\.claude/skills/'; then
            echo "::error::Generated changes are not limited to .claude/skills/"
            exit 1
          fi
          git diff --check
      - name: Commit generated skills only
        run: |
          git add -- .claude/skills
          if git diff --cached --quiet; then
            echo "No skill projection changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(skills): resync managed Claude assets from installed agent-loop'
          git push origin HEAD:refs/heads/feat/contract-approval-briefing-20261108
