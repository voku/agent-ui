name: One-shot Learning 0.18.2 dependency note

on:
  push:
    branches:
      - fix/loop-0201-recall-0171-floor
    paths:
      - .github/workflows/one-shot-learning-0182-note.yml

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/loop-0201-recall-0171-floor
      - name: Record the Learning precedent floor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          anchor = '- Exclude the broken Recall 0.17.0 patch while preserving the older supported lines: `voku/agent-recall-compiler ^0.15.0 || ^0.16.0 || ^0.17.1`.\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected exactly one Recall floor changelog entry')
          note = '- Require `voku/agent-learning ^0.18.2`, the first released owner patch that returns active LearningNotes as precedents for new tasks without direct findings, matching the UI return-loop dogfood.\n'
          path.write_text(text.replace(anchor, anchor + note, 1))
          PY
          git diff --check
      - name: Commit changelog note
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs(changelog): record Learning precedent floor'
          git push origin HEAD:fix/loop-0201-recall-0171-floor
