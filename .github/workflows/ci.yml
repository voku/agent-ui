name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  release-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.14.1
      - name: Cut 0.14.1 from Unreleased once
        shell: bash
        run: |
          if grep -Fq '## [0.14.1] - 2026-09-07' CHANGELOG.md; then
            echo '0.14.1 changelog already cut.'
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          lines = path.read_text().splitlines()
          unreleased = lines.index('## [Unreleased]')
          previous = lines.index('## [0.14.0] - 2026-09-05')
          body = lines[unreleased + 1:previous]
          replacement = [
              '',
              '## [0.14.1] - 2026-09-07',
              *body,
              '### Validation',
              '',
              '- PR #37 passed `composer ci` on PHP 8.3, 8.4 and 8.5; its PHP 8.3 `--prefer-lowest --prefer-stable` lane resolved released Learning 0.18.2, Loop 0.20.1, Recall 0.17.1, Map 0.10.0 and Runner 0.1.1, then passed the real LearningNote return-loop dogfood.',
              '- The Runner optional-installation matrix passed on the same PR head.',
              '',
          ]
          lines[unreleased + 1:previous] = replacement
          path.write_text(chr(10).join(lines) + chr(10))
          PY
          git diff --check
          grep -Fq '## [0.14.1] - 2026-09-07' CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'chore(release): cut 0.14.1 changelog'
          git push origin HEAD:release/0.14.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci

  lowest-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Resolve declared dependency floors
        run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
      - name: Validate lowest supported graph
        run: composer ci
