name: One-shot Loop 0.20.1 dependency note

on:
  push:
    branches:
      - fix/loop-0201-recall-0171-floor
    paths:
      - .github/workflows/one-shot-loop-0201-note.yml

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/loop-0201-recall-0171-floor
      - name: Record the fixed released floors
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [Unreleased]\n\n'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one Unreleased marker')
          note = (
              '### Fixed\n\n'
              '- Require `voku/agent-loop ^0.20.1` so lowest-supported installs include the released Recall-floor bridge instead of falling back to Loop 0.20.0.\n'
              '- Exclude the broken Recall 0.17.0 patch while preserving the older supported lines: `voku/agent-recall-compiler ^0.15.0 || ^0.16.0 || ^0.17.1`.\n\n'
          )
          path.write_text(text.replace(marker, marker + note, 1))
          PY
          git diff --check
      - name: Commit changelog note
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs(changelog): record fixed Loop and Recall floors'
          git push origin HEAD:fix/loop-0201-recall-0171-floor
