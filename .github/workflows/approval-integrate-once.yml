name: Build post-release approval UI integration (one-shot)
on:
  push:
    branches:
      - test/approval-integrated-candidate-20261108

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'voku/agent-ui' && github.ref == 'refs/heads/test/approval-integrated-candidate-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge the exact cumulative-delta UI candidate
        run: |
          set -euo pipefail
          git config user.name 'Approval integration CI'
          git config user.email 'approval-integration@users.noreply.github.com'
          git fetch origin efa8ac3f95597394453f29079dd0bde5d18345ca
          test "$(git rev-parse FETCH_HEAD)" = "efa8ac3f95597394453f29079dd0bde5d18345ca"
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            test "$(git diff --name-only --diff-filter=U)" = "composer.json"
            git checkout --ours composer.json
            grep -F '"voku/agent-loop": "^0.20.84"' composer.json
            git add composer.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f tests/Integration/ContractRevisionDeltaTest.php
      - name: Resolve the obsolete interim warning against owner-projected approved baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          template = Path('templates/task/index.php')
          source = template.read_text()
          marker = '        <?php if ($contract->revision > 2): ?>'
          assert source.count(marker) == 1, 'expected one obsolete interim warning'
          start = source.index(marker)
          end = source.index('        <div class="btn-row">', start)
          assert 'Revision history matters:' in source[start:end]
          template.write_text(source[:start] + source[end:])
          tests = Path('tests/Integration/ContractDecisionDeltaPageTest.php')
          source = tests.read_text()
          changes = {
              'testMultiRevisionBriefingWarnsThatAnIntermediateDraftMayHideChanges':
                  'testMultiRevisionBriefingUsesOwnerApprovedBaselineWithoutObsoleteWarning',
              "self::assertStringContainsString('draft revision 2.', $main);":
                  "self::assertStringContainsString('approved revision 1.', $main);",
              "self::assertStringContainsString('The displayed delta may omit earlier', $main);":
                  "self::assertStringNotContainsString('Revision history matters:', $main);",
              "self::assertStringContainsString('href=\"/task/APP-1/history\">revision event timeline</a>', $main);":
                  '',
              "self::assertStringContainsString('not complete archived Contract contents.', $main);":
                  '',
              "self::assertStringContainsString('a complete cumulative comparison is not yet available here.', $main);":
                  '',
          }
          for old, new in changes.items():
              assert source.count(old) == 1, f'expected one occurrence of {old}'
              source = source.replace(old, new)
          source = '\n'.join(line.rstrip() for line in source.split('\n'))
          tests.write_text(source)
          PY
          git rm -f .github/workflows/approval-owner-candidate.yml
          git rm -f .github/workflows/approval-integrate-once.yml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install stable graph and inject exact unmerged owner only in this runner
        run: composer install --no-interaction --prefer-dist
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: 64b36c22d216cec0d0e38890bfe75b6b307819b0
          path: .candidate-agent-loop
          persist-credentials: false
      - name: Verify exact owner checkout
        run: |
          test "$(git -C .candidate-agent-loop rev-parse HEAD)" = "64b36c22d216cec0d0e38890bfe75b6b307819b0"
          rm -rf vendor/voku/agent-loop
          mv .candidate-agent-loop vendor/voku/agent-loop
          composer dump-autoload --no-interaction
      - name: Execute merged browser tests and full candidate-compatible suite
        run: |
          vendor/bin/phpunit tests/Integration/ContractRevisionDeltaTest.php tests/Integration/ContractDecisionDeltaPageTest.php
          vendor/bin/phpunit --filter '^(?!.*ManagedSkillProjectionTest)'
          composer phpstan
          composer template-lint
          composer cs-check
      - name: Commit proven integration ONLY to this isolated test branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test/approval-integrated-candidate-20261108"
          test "$(git branch --show-current)" = "test/approval-integrated-candidate-20261108"
          git add -A
          git diff --cached --check
          git commit -m "test: integrate owner-backed approval UI without obsolete draft warning"
          git push origin HEAD:refs/heads/test/approval-integrated-candidate-20261108
