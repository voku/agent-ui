name: Reconcile published owner skills (temporary)
on:
  push:
    branches:
      - fix/recall-027-managed-skill-sync
    paths:
      - .github/workflows/temporary-managed-skill-reconcile.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install released owner graph
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preview and apply owner-managed Claude skill projection
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/agent-loop init install-assets --agent=claude --no-package-subagents --skip-git-config --dry-run
          vendor/bin/agent-loop init install-assets --agent=claude --no-package-subagents --skip-git-config
          git status --short
      - name: Reject any unexpected generated change
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              .claude/skills/.agent-loop-manifest.json | .claude/skills/agent-loop-php-setup/SKILL.md | .claude/skills/agent-recall-consumer/SKILL.md)
                ;;
              *)
                printf 'Unexpected generated change: %s\n' "$file" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)
          git diff --check
          git diff -- .claude/skills/.agent-loop-manifest.json .claude/skills/agent-loop-php-setup/SKILL.md .claude/skills/agent-recall-consumer/SKILL.md
          test -n "$(git status --porcelain=v1 -- .claude/skills)"
      - name: Commit exact owner-generated artifacts to isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/recall-027-managed-skill-sync'
          git add -- .claude/skills/.agent-loop-manifest.json .claude/skills/agent-loop-php-setup/SKILL.md .claude/skills/agent-recall-consumer/SKILL.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(skills): sync released Loop and Recall managed projections'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
