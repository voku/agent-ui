name: Temporary candidate owner-skill projection
on:
  push:
    branches:
      - feat/board-decision-inbox-183
    paths:
      - .github/workflows/temporary-candidate-owner-skills.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'voku/agent-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Canonical package-owned skill projection for two hosts
        run: |
          vendor/bin/agent-loop init install-assets --agent=claude --skip-git-config
          vendor/bin/agent-loop init install-assets --agent=codex --skip-git-config
      - name: Commit only managed skill projections
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- .claude/skills .codex/skills
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No managed skill projection changes"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(skills): regenerate managed owner skill projections"
          git push origin HEAD:refs/heads/feat/board-decision-inbox-183
